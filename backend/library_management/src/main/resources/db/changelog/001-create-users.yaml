databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: maria

      changes:
        - createTable:
            tableName: users

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(100)

              - column:
                  name: email
                  type: VARCHAR(100)

              - column:
                  name: password
                  type: VARCHAR(255)

              - column:
                  name: phone
                  type: VARCHAR(20)

              - column:
                  name: profile_image_url
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP