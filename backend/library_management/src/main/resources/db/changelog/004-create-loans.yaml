databaseChangeLog:
  - changeSet:
      id: 004-create-loans
      author: luis

      changes:
        - createTable:
            tableName: loans

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT

                  constraints:
                    nullable: false
                    foreignKeyName: fk_loans_user
                    references: users(id)

              - column:
                  name: book_id
                  type: BIGINT

                  constraints:
                    nullable: false

              - column:
                  name: loan_date
                  type: DATE

                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE

                  constraints:
                    nullable: false

              - column:
                  name: return_date
                  type: DATE

              - column:
                  name: returned
                  type: BOOLEAN

              - column:
                  name: status
                  type: BOOLEAN

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP
