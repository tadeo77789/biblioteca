databaseChangeLog:
  - changeSet:
      id: 003-create-books
      author: maria

      changes:
        - createTable:
            tableName: books

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(150)

                  constraints:
                    nullable: false

              - column:
                  name: isbn
                  type: VARCHAR(20)

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: author_id
                  type: BIGINT

                  constraints:
                    nullable: false

              - column:
                  name: published_year
                  type: INT

              - column:
                  name: available_copies
                  type: INT
                  defaultValueNumeric: 0

              - column:
                  name: cover_image_url
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: DATETIME

              - column:
                  name: updated_at
                  type: DATETIME

        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: author_id

            referencedTableName: authors
            referencedColumnNames: id

            constraintName: fk_books_author